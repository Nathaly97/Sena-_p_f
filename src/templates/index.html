<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
    <h1 class="text-center mt-5 mb-5 text-primary">Python-Flask-MySql</h1>
    <div class="container">
      <div class="card shadow">
        <div class="card-body">
          <form action="/user" method="POST">
            <div class="row mb-3">
              <div class="col">
                <label>Name</label>
                <input type="text" class="form-control mb-3" name="name">
              </div>
              <div class="col">
                <label>Email</label>
                <input type="text" class="form-control mb-3" name="email">
              </div>
              <div class="col">
                <label>Password</label>
                <input type="text" class="form-control mb-3" name="password">
              </div>
              <div class="col">
                <button class="btn btn-primary mb-3 mt-4" type="submit">Save</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Password</th>
            <th scope="col">Edit</th>
            <th scope="col">Delete</th>
          </tr>
        </thead>
        <tbody>
            {% for d in data %}
            <tr>
                <td>{{ d.id }}</td>
                <td>{{ d.name }}</td>
                <td>{{ d.email }}</td>
                <td>{{ d.password }}</td>
                <td><button class="btn btn-primary btn-sm" id="btn-edit{{d.id}}" data-bs-toggle="modal" data-bs-target="#modal{{d.id}}">Edit</button></td>
<td><a href="{{url_for('delete', id=d.id)}}" class="btn btn-danger btn-sm">Delete</a></td>
</tr>
<!--Modal de Bootstrap con personalizacion-->
<div class="modal fade" id="modal{{d.id}}" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">{{d.name}}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form action="/edit/{{d.id}}" method="post">
                    <label>name</label>
                    <input type="text" class="form-control mb-3" name="name" value="{{d.name}}">
                    <label>Email</label>
                    <input type="text" class="form-control mb-3" name="email" value="{{d.email}}">
                    <label>Password</label>
                    <input type="text" class="form-control mb-3" name="password" value="{{d.password}}">
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
            </form>
        </div>
    </div>
</div>
{% endfor %}
        </tbody>
        
      </table>
  </body>
  
</html>
